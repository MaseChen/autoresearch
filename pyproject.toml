[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-kernel-fused-moe"
version = "0.1.0"
description = "External-agent Triton optimization loop for a quantized Fused MoE operator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
kernel-research = "kernel_research.cli:main"

[tool.setuptools.packages.find]
include = ["kernel_research*"]
