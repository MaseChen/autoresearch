[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-kernel-fused-moe"
version = "0.3.0"
description = "External-agent Triton optimization loop for a quantized Fused MoE operator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6",
]

[project.scripts]
kernel-research = "kernel_research.cli:main"
kernel-autoresearch = "kernel_research.autorun.cli:main"

[tool.setuptools.packages.find]
include = ["kernel_research*"]

[tool.coverage.run]
branch = true
source = ["kernel_research"]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
skip_covered = false
